[extend]
  useDefault = true

[[rules]]
  type = "secret"
  id = "rfc1918"
  pattern = "10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.1[6-9]\\.\\d{1,3}\\.\\d{1,3}|172\\.2[0-9]\\.\\d{1,3}\\.\\d{1,3}|172\\.3[0-1]\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}"
  action = "deny"
  title = "RFC1918 IPv4 literal detected"
  length = "long"

[[rules]]
  type = "secret"
  id = "cgnat"
  pattern = "100\\.64\\.\\d{1,3}\\.\\d{1,3}"
  action = "deny"
  title = "CGNAT tailnet IPv4 literal detected"
  length = "long"

[[rules]]
  type = "secret"
  id = "tsnet"
  pattern = ".*\\.ts\\.net"
  action = "deny"
  title = "*.ts.net hostname detected"
  length = "long"

[allowlist]
  paths = []