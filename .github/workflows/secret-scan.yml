name: secret-scan
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          verbose: true

  secret-scan-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run gitleaks selftest against fixtures
        run: |
          set -e
          RESULT=$(gitleaks detect --no-git --source ci/fixtures/secret-scan --config ci/fixtures/secret-scan/gitleaks-selftest.toml)
          echo "$RESULT"
          if [ -z "$RESULT" ]; then
            echo "selftest: scanner did not flag fixtures"
            exit 1
          fi