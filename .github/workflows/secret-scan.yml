name: secret-scan
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
        with:
          config: .gitleaks.toml
          verbose: true

  secret-scan-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks selftest against fixtures
        run: |
          gitleaks detect --no-git --source ci/fixtures/secret-scan \
            --config ci/fixtures/secret-scan/gitleaks-selftest.toml \
            --report-format json --report-path /tmp/selftest.json --exit-code 0
          COUNT=$(jq 'length' /tmp/selftest.json)
          RULES=$(jq -r '.[].RuleID' /tmp/selftest.json | sort -u | tr '\n' ' ')
          echo "selftest findings: $COUNT rules: $RULES"
          for r in rfc1918-ipv4 cgnat-tailnet-ipv4 ts-net-hostname; do
            echo "$RULES" | grep -q "$r" || { echo "selftest: rule $r did not fire on the fixtures"; exit 1; }
          done
